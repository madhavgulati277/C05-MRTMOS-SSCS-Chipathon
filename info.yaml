# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
# ======================================================
# Chipathon 2026: info.yaml Configuration
# ======================================================
# Pin numbers go from top right to bottom left pin, as in block A.
# ======================================================

project:
  title: "MRTMOS - Compensation Networks Illustration Chip"
  team: "C05 MRTMOS"
  discord: "madhavgulati277, tur0922, ramann_696"
  description: "OTA with Switched Compensation Block"
  top_module: "MRTMOS_chip_final"          # MUST REPLACE: Match this exactly to your GDS top cell
  gds: "./MRTMOS_chip_final.gds"                # Path to your GDS file

# ======================================================
# Pin Declarations (P1 to P22)
# ======================================================
# --- Gm1 Inputs ---
  - name: p1_gm1_in1
    io_type: analog
  - name: p2_gm1_in2
    io_type: analog

  # --- Gmff Inputs ---
  - name: p3_gmff_in1
    io_type: analog
  - name: p4_gmff_in2
    io_type: analog

  # --- External Components / Test Pins ---
  - name: p5_miller_rc_1
    io_type: analog
  - name: p6_miller_rc_2
    io_type: analog
  - name: p7_shunt_cap
    io_type: analog

  # --- Gm2 ---
  - name: p8_gm2_in_minus
    io_type: analog

  # --- Nested Miller ---
  - name: p9_nested_rc_1
    io_type: analog
  - name: p10_nested_rc_2
    io_type: analog

  # --- Gm3 ---
  - name: p11_gm3_in_minus
    io_type: analog

  # --- Power & Ground ---
  - name: p12_gnd
    io_type: ground

  # --- Gmff Adjust ---
  - name: p13_gmff_ext_res
    io_type: analog

  # --- Power ---
  - name: p14_vdd
    io_type: power

  # --- Output ---
  - name: p15_out
    io_type: analog

  # --- 7-bit Decoder Inputs ---
  - name: p16_dec_0
    io_type: input_cmos
  - name: p17_dec_1
    io_type: input_cmos
  - name: p18_dec_2
    io_type: input_cmos
  - name: p19_dec_3
    io_type: input_cmos
  - name: p20_dec_4
    io_type: input_cmos
  - name: p21_dec_5
    io_type: input_cmos
  - name: p22_dec_6
    io_type: input_cmos
